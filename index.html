<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuestro amor · Наша любовь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f1e7; --paper2:#efe6d6; --ink:#1e1a17; --soft:#5d534b;
    --wine:#7b2d3b; --gold:#c48a36; --line:rgba(30,26,23,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:'Lora',Georgia,serif;line-height:1.7;overflow-x:hidden;
    background-image:radial-gradient(rgba(30,26,23,.035) 1px,transparent 1px);background-size:5px 5px}
  h1,h2{font-family:'Cormorant Garamond',serif;font-weight:600;line-height:1.05}
  .hand{font-family:'Caveat',cursive}
  img{display:block;max-width:100%}

  /* idioma */
  .lang{position:fixed;top:14px;right:14px;z-index:50;display:flex;background:rgba(247,241,231,.9);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:30px;padding:3px}
  .lang button{border:0;background:none;font:600 13px 'Lora',serif;letter-spacing:.06em;padding:6px 12px;border-radius:30px;cursor:pointer;color:var(--soft)}
  .lang button.on{background:var(--ink);color:var(--paper)}

  /* portada */
  .hero{min-height:100svh;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 22px 60px;overflow:hidden}
  .strings{position:absolute;inset:0 0 auto 0;height:62vh;pointer-events:none;opacity:.9}
  .strings svg{width:100%;height:100%}
  .str{transform-origin:top center;animation:sway var(--d,6s) ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(calc(var(--a,1.4deg) * -1))}to{transform:rotate(var(--a,1.4deg))}}
  .portrait{width:min(250px,58vw);aspect-ratio:1;border-radius:50%;overflow:hidden;border:6px solid var(--paper);
    box-shadow:0 0 0 1px var(--line),0 24px 50px -18px rgba(60,30,20,.45);position:relative;z-index:2;margin-bottom:26px;
    animation:rise 1.4s ease both}
  .portrait img{width:100%;height:100%;object-fit:cover}
  .kicker{font-size:30px;color:var(--wine);animation:rise 1.4s .2s ease both}
  .hero h1{font-size:clamp(54px,14vw,120px);margin:2px 0 10px;animation:rise 1.4s .35s ease both}
  .since{font-style:italic;color:var(--soft);animation:rise 1.4s .5s ease both}
  .counter{display:flex;gap:clamp(10px,3vw,26px);margin-top:30px;animation:rise 1.4s .65s ease both}
  .counter div{min-width:64px}
  .counter b{display:block;font:600 clamp(32px,8vw,54px)/1 'Cormorant Garamond',serif;color:var(--wine)}
  .counter span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
  .and{margin-top:14px;font-size:26px;color:var(--soft);animation:rise 1.4s .8s ease both}
  .down{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:22px;color:var(--soft);animation:bob 2s infinite}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes bob{50%{transform:translate(-50%,6px)}}

  section{padding:90px 22px;max-width:1080px;margin:0 auto}
  .head{text-align:center;margin-bottom:46px}
  .head .hand{font-size:28px;color:var(--wine)}
  .head h2{font-size:clamp(40px,8vw,64px)}
  .head p{max-width:560px;margin:14px auto 0;color:var(--soft)}
  .rule{width:90px;height:1px;background:var(--ink);opacity:.3;margin:18px auto 0;position:relative}
  .rule::after{content:"♥";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);background:var(--paper);padding:0 8px;font-size:13px;color:var(--wine)}

  /* inicio */
  .date{display:flex;flex-direction:column;align-items:center;text-align:center}
  .date .big{font:600 clamp(72px,18vw,150px)/.9 'Cormorant Garamond',serif;color:var(--wine)}
  .date .big small{display:block;font-size:.32em;color:var(--ink);letter-spacing:.2em;margin-top:8px}
  .date p{max-width:560px;margin-top:28px;font-size:18px}

  /* galería */
  .gallery{columns:3 260px;column-gap:22px}
  .card{break-inside:avoid;margin:0 0 26px;background:#fff;padding:12px 12px 6px;box-shadow:0 14px 30px -16px rgba(60,30,20,.35);
    transform:rotate(var(--r,0deg));transition:transform .4s,box-shadow .4s;cursor:zoom-in;opacity:0;translate:0 24px}
  .card.seen{opacity:1;translate:0 0;transition:transform .4s,box-shadow .4s,opacity .9s,translate .9s}
  .card:hover{transform:rotate(0) scale(1.02);box-shadow:0 22px 40px -16px rgba(60,30,20,.45)}
  .card figcaption{font-family:'Caveat',cursive;font-size:24px;text-align:center;padding:8px 4px 4px;line-height:1.2}
  .card figcaption small{display:block;font:italic 13px 'Lora',serif;color:var(--soft);margin-top:2px}

  /* comparación */
  .compare{position:relative;width:min(560px,100%);aspect-ratio:3/4;margin:0 auto;overflow:hidden;border:10px solid #fff;
    box-shadow:0 20px 40px -18px rgba(60,30,20,.45);touch-action:none;user-select:none;cursor:ew-resize}
  .compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .compare .top{clip-path:inset(0 0 0 var(--x,50%))}
  .compare .bar{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;background:#fff;transform:translateX(-1px)}
  .compare .knob{position:absolute;top:50%;left:50%;width:46px;height:46px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);
    display:grid;place-items:center;color:var(--wine);font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  .labels{display:flex;justify-content:space-between;width:min(560px,100%);margin:12px auto 0;font-family:'Caveat',cursive;font-size:22px;color:var(--soft)}

  /* paseos */
  .walk{position:relative;min-height:80svh;display:flex;align-items:flex-end;background:url(img/parque.jpg) center/cover fixed;padding:0}
  @media (max-width:900px),(hover:none){.walk{background-attachment:scroll}}
  .walk .veil{width:100%;padding:120px 22px 60px;background:linear-gradient(transparent,rgba(20,18,12,.78));color:#fbf6ec;text-align:center}
  .walk .hand{font-size:28px;color:#f1c98a}
  .walk h2{font-size:clamp(40px,8vw,64px)}
  .walk p{max-width:560px;margin:10px auto 0}

  /* carta */
  .letter-wrap{display:flex;flex-direction:column;align-items:center}
  .env{width:min(380px,90vw);aspect-ratio:1.55;position:relative;cursor:pointer;margin-top:10px;transition:transform .3s,margin .7s}
  .env.open{margin-top:150px}
  .env:hover{transform:translateY(-4px)}
  .env .back{position:absolute;inset:0;background:var(--wine);border-radius:6px;box-shadow:0 22px 40px -18px rgba(60,20,20,.6)}
  .env .flap{position:absolute;inset:0 0 auto 0;height:58%;background:#8f3747;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s;border-radius:6px 6px 0 0;z-index:3}
  .env .front{position:absolute;inset:0;background:linear-gradient(160deg,#8a3343,#6c2733);clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);border-radius:6px;z-index:2}
  .env .seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:4;width:58px;height:58px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#e0aa55,#a8721f);display:grid;place-items:center;color:#5a1d24;font-size:24px;box-shadow:0 3px 8px rgba(0,0,0,.35);transition:opacity .4s}
  .env.open .flap{transform:rotateX(180deg)}
  .env.open .seal{opacity:0}
  .tap{margin-top:16px;font-size:24px;color:var(--soft)}
  .paper{max-width:620px;width:100%;background:#fffdf8;padding:44px 34px;margin-top:-10px;box-shadow:0 20px 40px -20px rgba(60,30,20,.4);
    background-image:repeating-linear-gradient(transparent 0 37px,rgba(123,45,59,.12) 37px 38px);
    font-family:'Caveat',cursive;font-size:27px;line-height:38px;display:none;transform-origin:top}
  .paper.show{display:block;animation:unfold .9s ease both}
  .paper p{margin-bottom:38px}
  .paper .sign{text-align:right;color:var(--wine);margin:0}
  @keyframes unfold{from{opacity:0;transform:translateY(-30px) scaleY(.6)}to{opacity:1;transform:none}}

  footer{text-align:center;padding:60px 22px 70px;color:var(--soft)}
  footer .hand{font-size:34px;color:var(--wine)}


  /* música */
  .listen{margin-top:26px;display:inline-flex;align-items:center;gap:10px;border:1px solid var(--wine);color:var(--wine);background:transparent;
    font:500 16px 'Lora',serif;padding:10px 20px;border-radius:40px;cursor:pointer;animation:rise 1.4s .95s ease both;transition:background .3s,color .3s}
  .listen:hover{background:var(--wine);color:var(--paper)}
  .player{position:fixed;left:50%;bottom:16px;transform:translate(-50%,140%);z-index:60;display:flex;align-items:center;gap:10px;
    background:rgba(30,26,23,.92);color:var(--paper);backdrop-filter:blur(8px);padding:7px 10px 7px 7px;border-radius:50px;
    box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:transform .6s cubic-bezier(.2,.9,.3,1.2);max-width:calc(100vw - 24px)}
  .player.on{transform:translate(-50%,0)}
  .disc{width:40px;height:40px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--paper) 0 4px,#7b2d3b 5px 9px,#1e1a17 10px 100%);
    border:1px solid rgba(255,255,255,.15);animation:spin 3.5s linear infinite;animation-play-state:paused}
  .player.playing .disc{animation-play-state:running}
  @keyframes spin{to{transform:rotate(360deg)}}
  .player .t{font-family:'Caveat',cursive;font-size:22px;line-height:1;white-space:nowrap;min-width:110px}
  .player .t small{display:block;font:11px 'Lora',serif;opacity:.6;margin-top:3px}
  .player button{width:38px;height:38px;border:0;border-radius:50%;background:none;color:var(--paper);font-size:17px;cursor:pointer;flex:none}
  .player button.pp{background:var(--wine)}
  .bar2{position:absolute;left:24px;right:24px;bottom:2px;height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
  .bar2 i{display:block;height:100%;width:0;background:#e0aa55}

  /* visor */
  .lb{position:fixed;inset:0;background:rgba(18,15,12,.92);z-index:80;display:none;align-items:center;justify-content:center;padding:20px;flex-direction:column}
  .lb.on{display:flex}
  .lb img{max-height:82vh;max-width:94vw;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .lb p{color:#f3ead9;font-family:'Caveat',cursive;font-size:28px;margin-top:12px;text-align:center}
  .lb button{position:absolute;top:14px;right:18px;background:none;border:0;color:#fff;font-size:34px;cursor:pointer}

  .pop{position:fixed;pointer-events:none;z-index:90;color:var(--wine);font-size:20px;animation:float 1.6s ease-out forwards}
  @keyframes float{to{transform:translate(var(--dx),-90px) scale(1.4);opacity:0}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;translate:0 0}}
</style>
</head>
<body>

<div class="lang"><button data-l="es">ES</button><button data-l="ru">RU</button></div>

<header class="hero">
  <div class="strings"><svg id="strings" preserveAspectRatio="none"></svg></div>
  <div class="portrait"><img src="img/retrato.jpg" alt=""></div>
  <div class="kicker hand" data-es="Para Natalia" data-ru="Для Натальи"></div>
  <h1 data-es="Nuestro amor" data-ru="Наша любовь"></h1>
  <div class="since" data-es="Juntos desde el 9 de enero de 2022" data-ru="Вместе с 9 января 2022 года"></div>
  <div class="counter">
    <div><b id="cd">0</b><span id="ld"></span></div>
    <div><b id="ch">0</b><span id="lh"></span></div>
    <div><b id="cm">0</b><span id="lm"></span></div>
    <div><b id="cs">0</b><span id="ls"></span></div>
  </div>
  <div class="and hand" data-es="…y seguimos sumando" data-ru="…и это только начало"></div>
  <button class="listen" id="listen">♪ <span data-es="Escuchar nuestra música" data-ru="Послушать нашу музыку"></span></button>
  <div class="down">↓</div>
</header>

<section class="date">
  <div class="head">
    <div class="hand" data-es="donde empezó todo" data-ru="где всё началось"></div>
    <h2 data-es="El primer día" data-ru="Первый день"></h2>
    <div class="rule"></div>
  </div>
  <div class="big">9<small data-es="ENERO · 2022" data-ru="ЯНВАРЯ · 2022"></small></div>
  <p data-es="Un día de invierno, el 9 de enero de 2022, nos conocimos. Desde entonces aprendimos a mirar el mundo con los mismos ojos: con un lápiz en la mano y el corazón abierto."
     data-ru="Зимним днём, 9 января 2022 года, мы познакомились. С тех пор мы учимся смотреть на мир одними глазами — с карандашом в руке и открытым сердцем."></p>
</section>

<section>
  <div class="head">
    <div class="hand" data-es="tinta, lápiz y color" data-ru="тушь, карандаш и краски"></div>
    <h2 data-es="Nosotros creamos arte" data-ru="Мы создаём искусство"></h2>
    <p data-es="Cada dibujo es una página de nuestra historia." data-ru="Каждый рисунок — страница нашей истории."></p>
    <div class="rule"></div>
  </div>
  <div class="gallery" id="gallery"></div>
</section>

<section>
  <div class="head">
    <div class="hand" data-es="deslizá para ver" data-ru="проведи, чтобы увидеть"></div>
    <h2 data-es="Un lugar, dos miradas" data-ru="Одно место — два взгляда"></h2>
    <p data-es="La cámara ve la luz; el lápiz ve lo que sentimos." data-ru="Камера видит свет, а карандаш — то, что мы чувствуем."></p>
    <div class="rule"></div>
  </div>
  <div class="compare" id="compare">
    <img src="img/salon-dibujo.jpg" alt="">
    <img class="top" src="img/salon-foto.jpg" alt="">
    <div class="bar"><div class="knob">↔</div></div>
  </div>
  <div class="labels"><span data-es="el dibujo" data-ru="рисунок"></span><span data-es="la foto" data-ru="фото"></span></div>
</section>

<div class="walk">
  <div class="veil">
    <div class="hand" data-es="de la mano" data-ru="рука об руку"></div>
    <h2 data-es="Nuestros paseos" data-ru="Наши прогулки"></h2>
    <p data-es="Los caminos más lindos son los que hacemos juntos." data-ru="Самые красивые дороги — те, по которым мы идём вместе."></p>
  </div>
</div>

<section class="letter-wrap">
  <div class="head">
    <div class="hand" data-es="solo para vos" data-ru="только для тебя"></div>
    <h2 data-es="Una carta" data-ru="Письмо"></h2>
    <div class="rule"></div>
  </div>
  <div class="env" id="env"><div class="back"></div><div class="front"></div><div class="flap"></div><div class="seal">♥</div></div>
  <div class="tap hand" id="tap" data-es="tocá el sobre" data-ru="нажми на конверт"></div>
  <div class="paper" id="paper">
    <p data-es="Natalia:" data-ru="Наталья,"></p>
    <p data-es="Desde aquel 9 de enero, cada día tiene un color nuevo. Vos dibujás corazones y yo escribo historias, pero la más linda es la que estamos escribiendo juntos."
       data-ru="С того 9 января каждый день окрашен в новый цвет. Ты рисуешь сердца, я пишу истории, но самая прекрасная из них — та, что мы пишем вместе."></p>
    <p data-es="Gracias por cada trazo, cada paseo y cada sonrisa. Te amo." data-ru="Спасибо за каждый штрих, каждую прогулку и каждую улыбку. Я люблю тебя."></p>
    <p class="sign" data-es="Tu Luis" data-ru="Твой Луис"></p>
  </div>
</section>

<footer>
  <div class="hand">9.01.2022 — ∞</div>
  <div data-es="Nuestro amor · Наша любовь" data-ru="Наша любовь · Nuestro amor"></div>
</footer>

<div class="player" id="player">
  <div class="disc"></div>
  <div class="t"><span id="tname"></span><small id="tnum"></small></div>
  <button class="pp" id="pp" aria-label="play">❚❚</button>
  <button id="nx" aria-label="next">⏭</button>
  <div class="bar2"><i id="prog"></i></div>
</div>
<audio id="au" preload="none"></audio>

<div class="lb" id="lb"><button aria-label="cerrar">×</button><img alt=""><p></p></div>

<script>
const ART=[
  {f:'retrato',r:-1.5,es:'Tu mirada',ru:'Твой взгляд'},
  {f:'mi-profe',r:1.8,es:'«Mi profe»',ru:'«Mi profe»',ses:'',sru:'«Мой учитель»'},
  {f:'corazones',r:-1,es:'Lluvia de corazones',ru:'Дождь из сердец'},
  {f:'abrazo-pintura',r:1.2,es:'Un abrazo entre viñedos',ru:'Объятие среди виноградников',ses:'Luis Fader',sru:'Луис Фадер'},
  {f:'vamos-a-casa',r:-1.6,es:'¡Vamos a casa!',ru:'¡Vamos a casa!',ses:'',sru:'«Пойдём домой!»'},
  {f:'plantas',r:1,es:'Nuestro jardín de tinta',ru:'Наш чернильный сад'},
];
let L='es';
const g=document.getElementById('gallery');
ART.forEach(a=>{
  const c=document.createElement('figure');c.className='card';c.style.setProperty('--r',a.r+'deg');
  c.innerHTML=`<img src="img/${a.f}.jpg" alt="" loading="lazy"><figcaption></figcaption>`;
  c.onclick=()=>openLb(a);a.el=c;g.appendChild(c);
});
function cap(a){const s=L==='es'?a.ses:a.sru;return (L==='es'?a.es:a.ru)+(s?`<small>${s}</small>`:'')}

function plural(n,forms){const m10=n%10,m100=n%100;
  if(m10===1&&m100!==11)return forms[0];if(m10>=2&&m10<=4&&(m100<12||m100>14))return forms[1];return forms[2]}
const U={es:[['día','días'],['hora','horas'],['minuto','minutos'],['segundo','segundos']],
  ru:[['день','дня','дней'],['час','часа','часов'],['минута','минуты','минут'],['секунда','секунды','секунд']]};
const start=new Date(2022,0,9);
function tick(){
  let s=Math.floor((Date.now()-start)/1000);
  const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];
  ['d','h','m','s'].forEach((k,i)=>{
    document.getElementById('c'+k).textContent=v[i].toLocaleString(L==='es'?'es-AR':'ru-RU');
    document.getElementById('l'+k).textContent=L==='es'?(v[i]===1?U.es[i][0]:U.es[i][1]):plural(v[i],U.ru[i]);
  });
}
function setLang(l){
  L=l;document.documentElement.lang=l;
  document.querySelectorAll('[data-'+l+']').forEach(e=>e.textContent=e.dataset[l]);
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  ART.forEach(a=>a.el.querySelector('figcaption').innerHTML=cap(a));
  document.title=l==='es'?'Nuestro amor':'Наша любовь';
  try{localStorage.setItem('na-lang',l)}catch(e){}
  tick();
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
let saved=null;try{saved=localStorage.getItem('na-lang')}catch(e){}
setLang(saved||((navigator.language||'').startsWith('ru')?'ru':'es'));
setInterval(tick,1000);

/* hilos de corazones, como su dibujo */
(function(){
  const svg=document.getElementById('strings');const W=1000,H=600;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const heart=(x,y,s)=>`<path d="M${x} ${y+s*.9} C${x-s*1.4} ${y-s*.1} ${x-s*.7} ${y-s*1.1} ${x} ${y-s*.35} C${x+s*.7} ${y-s*1.1} ${x+s*1.4} ${y-s*.1} ${x} ${y+s*.9}Z" fill="#1e1a17"/>`;
  let out='';const n=window.innerWidth<600?9:16;
  for(let i=0;i<n;i++){
    const x=20+i*(W-40)/(n-1)+(Math.random()*16-8);
    const mid=(W*.32<x&&x<W*.68);const len=(mid?120:220)+Math.random()*(mid?60:300);
    let g=`<g class="str" style="--d:${5+Math.random()*4}s;--a:${(0.8+Math.random()*1.4).toFixed(2)}deg;transform-origin:${x}px 0"><path d="M${x} 0 Q${x+(Math.random()*20-10)} ${len/2} ${x} ${len}" stroke="#1e1a17" stroke-width="1.6" fill="none"/>`;
    let y=24+Math.random()*30;
    while(y<len){
      if(Math.random()<.42)g+=heart(x,y,5+Math.random()*7);else g+=`<circle cx="${x}" cy="${y}" r="${2+Math.random()*1.8}" fill="#1e1a17"/>`;
      y+=14+Math.random()*34;
    }
    g+=heart(x,len+6,6+Math.random()*4)+'</g>';out+=g;
  }
  svg.innerHTML=out;
})();

/* aparecer al bajar */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('seen');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.card').forEach(c=>io.observe(c));

/* comparación */
const cmp=document.getElementById('compare');
function setX(e){const r=cmp.getBoundingClientRect();const x=Math.min(100,Math.max(0,(e.clientX-r.left)/r.width*100));cmp.style.setProperty('--x',x+'%')}
let drag=false;
cmp.addEventListener('pointerdown',e=>{drag=true;cmp.setPointerCapture(e.pointerId);setX(e)});
cmp.addEventListener('pointermove',e=>{if(drag)setX(e)});
cmp.addEventListener('pointerup',()=>drag=false);

/* carta */
const env=document.getElementById('env'),paper=document.getElementById('paper');
env.onclick=()=>{if(env.classList.contains('open'))return;env.classList.add('open');document.getElementById('tap').style.visibility='hidden';
  setTimeout(()=>{paper.classList.add('show');paper.scrollIntoView({behavior:'smooth',block:'center'})},650);
  const r=env.getBoundingClientRect();for(let i=0;i<14;i++)setTimeout(()=>pop(r.left+r.width/2+(Math.random()*160-80),r.top+r.height/2),i*60)};


/* música */
const SONGS=[{f:'enamorada',t:'Enamorada'},{f:'tu-silencio',t:'Tu silencio'}];
const au=document.getElementById('au'),pl=document.getElementById('player'),ppb=document.getElementById('pp');
let ti=0;
function load(i){ti=(i+SONGS.length)%SONGS.length;au.src='music/'+SONGS[ti].f+'.mp3';
  document.getElementById('tname').textContent=SONGS[ti].t;document.getElementById('tnum').textContent=(ti+1)+' / '+SONGS.length}
function play(){pl.classList.add('on');const pr=au.play();if(pr)pr.catch(()=>{})}
au.onplay=()=>{pl.classList.add('playing');ppb.textContent='❚❚'};
au.onpause=()=>{pl.classList.remove('playing');ppb.textContent='▶'};
au.onended=()=>{load(ti+1);play()};
au.ontimeupdate=()=>{if(au.duration)document.getElementById('prog').style.width=(au.currentTime/au.duration*100)+'%'};
ppb.onclick=e=>{e.stopPropagation();au.paused?play():au.pause()};
document.getElementById('nx').onclick=e=>{e.stopPropagation();load(ti+1);play()};
document.getElementById('listen').onclick=e=>{e.stopPropagation();if(au.paused)play();e.currentTarget.style.visibility='hidden'};
load(0);

/* visor */
const lb=document.getElementById('lb');
function openLb(a){lb.querySelector('img').src=`img/${a.f}.jpg`;lb.querySelector('p').innerHTML=(L==='es'?a.es:a.ru);lb.classList.add('on')}
lb.onclick=()=>lb.classList.remove('on');

/* corazoncitos al tocar */
function pop(x,y){const h=document.createElement('div');h.className='pop';h.textContent='♥';h.style.left=x+'px';h.style.top=y+'px';
  h.style.setProperty('--dx',(Math.random()*60-30)+'px');document.body.appendChild(h);setTimeout(()=>h.remove(),1700)}
document.addEventListener('click',e=>{if(!e.target.closest('.card,.lang,.lb,.env,.compare,.player,.listen'))pop(e.clientX,e.clientY)});
</script>
</body>
</html>
